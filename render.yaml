# KSPDB Fault Localization Engine - Render Blueprint

databases:
  - name: kspdb-db
    plan: free
    databaseName: kspdb_fault_localization
    user: postgres

services:
  # 1. Backend (Node.js API)
  - type: web
    name: kspdb-backend
    env: docker
    plan: free
    dockerfilePath: apps/backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kspdb-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: FORCE_RESEED
        value: "0"
      - key: ANTHROPIC_API_KEY
        sync: false

  # 2. Worker
  - type: worker
    name: kspdb-worker
    env: docker
    plan: free
    dockerfilePath: apps/backend/Dockerfile
    dockerCommand: worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kspdb-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: TELEMETRY_BASE_URL
        value: http://kspdb-backend:3000
      - key: HEARTBEAT_EMITTER_STARTUP
        value: "1"
      - key: ANTHROPIC_API_KEY
        sync: false

  # 3. Frontend (Nginx SPA)
  - type: web
    name: kspdb-frontend
    env: docker
    plan: free
    dockerfilePath: apps/frontend/Dockerfile
    envVars:
      - key: BACKEND_URL
        value: http://kspdb-backend:3000
