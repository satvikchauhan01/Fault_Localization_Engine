# KSPDB Fault Localization Engine - Render Blueprint
services:
  # 1. PostgreSQL Database
  - type: pserv
    name: kspdb-db
    plan: free
    envVars:
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        generateValue: true
      - key: POSTGRES_DB
        value: kspdb_fault_localization

  # 2. Backend (Node.js API)
  - type: web
    name: kspdb-backend
    env: docker
    plan: free
    dockerfilePath: apps/backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kspdb-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: FORCE_RESEED
        value: "0"
      - key: ANTHROPIC_API_KEY
        sync: false

  # 3. Worker
  - type: worker
    name: kspdb-worker
    env: docker
    plan: free
    dockerfilePath: apps/backend/Dockerfile
    dockerCommand: worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kspdb-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: TELEMETRY_BASE_URL
        value: http://kspdb-backend:3000
      - key: HEARTBEAT_EMITTER_STARTUP
        value: "1"
      - key: ANTHROPIC_API_KEY
        sync: false

  # 4. Frontend (Nginx SPA)
  - type: web
    name: kspdb-frontend
    env: docker
    plan: free
    dockerfilePath: apps/frontend/Dockerfile
    envVars:
      - key: BACKEND_URL
        value: http://kspdb-backend:3000
